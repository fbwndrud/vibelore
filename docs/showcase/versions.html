<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<script src="i18n.js?v=9"></script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>버전 연혁 · vibelore 제작 예시</title>
<meta name="description" content="vibelore 버전마다 바뀐 점과 그 버전으로 만든 작품.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="shared/site.css?v=1">
<style>
.tl-box{margin-top:28px;padding:28px;overflow-x:auto}
.tl{--cols:7;display:grid;grid-template-columns:200px repeat(var(--cols),minmax(110px,1fr));gap:16px 12px;align-items:center;min-width:1000px}
.tl .vh{display:flex;flex-direction:column;gap:2px;padding-bottom:12px;border-bottom:2px solid var(--ink);align-self:end}
.tl .vh b{font-size:18px}.tl .vh span{font-size:12px;color:var(--muted)}
.tl .vh.has{border-bottom-color:var(--gold)}
.tl .sum{font-size:12.5px;line-height:1.55;color:var(--sub);align-self:start}
.tl .rowlabel{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted);align-self:start}
.tl .rule{grid-column:1/-1;height:1px;background:var(--line2)}
.tl .who{display:flex;align-items:center;gap:12px;font-weight:700;font-size:15px}
.tl .who .gl{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.tl .who img{width:48px;height:48px;border-radius:8px;object-fit:cover;object-position:top;flex-shrink:0}
.tl .bar{min-height:44px;border-radius:10px;color:#fff;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px;padding:8px 14px;font-size:13px}
.tl .bar span:not(:first-child){opacity:.88}
.tl .bar:hover{color:#fff;filter:brightness(1.12)}
.hint{margin-top:16px;font-size:13.5px;color:var(--sub)}
</style>
</head>
<body data-page="versions" data-root="">
<div class="shell">
<header id="top"></header>
<div class="wrap page-h">
  <div>
    <h1>버전 연혁</h1>
    <p>작품은 만든 vibelore 버전 위에 놓입니다. 막대가 길면 여러 버전에 걸쳐 만든 작품입니다. 같은 도구라도 버전에 따라 검사와 웹툰 흐름이 달라, 작품끼리 결과를 그대로 비교하지 마세요.</p>
  </div>
</div>
<div class="wrap" style="padding-bottom:56px">
  <div class="card tl-box"><div class="tl" id="tl"></div></div>
  <p class="hint">막대 위 글씨는 회차별 실행 버전입니다(워크플로 기록의 runtime.packageVersion 기준). 막대를 누르면 그 작품으로 갑니다. 버전 요약은 CHANGELOG.md에서 옮겼습니다.</p>
</div>
<footer class="foot">
  <span>버전과 작품은 works.json 한 곳에서 만들어집니다.</span>
  <span data-i18n="common.madeWithLink">제작 도구 <a href="https://github.com/fbwndrud/vibelore">vibelore</a></span>
</footer>
</div>
<script src="shared/chrome.js?v=1"></script>
<script>
(function () {
  'use strict';
  const { el, cmpVer, loadCatalog } = window.Showcase;
  loadCatalog().then(({ versions, works }) => {
    const vs = versions.slice().sort((a, b) => cmpVer(a.v, b.v));
    const idx = (v) => vs.findIndex((x) => x.v === v);
    const used = new Set();
    for (const w of works) for (let i = idx(w.version.from); i <= idx(w.version.to); i++) used.add(i);
    const tl = document.getElementById('tl');
    tl.style.setProperty('--cols', vs.length);
    const date = (d) => { const [, m, day] = d.split('-').map(Number); return I18N.lang === 'ko' ? `${m}월 ${day}일` : new Date(d + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); };
    tl.append(el('span'), ...vs.map((v, i) => el('div', { class: 'vh' + (used.has(i) ? ' has' : '') }, el('b', null, v.v), el('span', null, date(v.date)))));
    tl.append(el('span', { class: 'rowlabel' }, '이 버전에서 바뀐 점'), ...vs.map((v) => el('span', { class: 'sum' }, v.summary)));
    tl.append(el('div', { class: 'rule' }));
    // 늦게 끝난 작품이 아래로 오게 해 시간 순서대로 읽힌다.
    const rows = works.slice().sort((a, b) => cmpVer(a.version.from, b.version.from) || cmpVer(a.version.to, b.version.to));
    for (const w of rows) {
      const a = idx(w.version.from); const b = idx(w.version.to);
      if (a < 0 || b < 0) continue;
      tl.append(el('a', { class: 'who', href: w.href }, el('img', { src: w.cover, alt: '', loading: 'lazy' }), el('span', null, el('span', { lang: 'ko' }, w.title), w.gloss ? el('span', { class: 'gl en-only' }, w.gloss) : null)));
      if (a > 0) tl.append(el('span', { style: `grid-column:span ${a}` }));
      tl.append(el('a', { class: 'bar', href: w.href, title: w.version.detail, style: `grid-column:span ${b - a + 1};background:${w.bg || w.tone}` }, w.bar.map((t, i) => el(i === 0 ? 'b' : 'span', null, t))));
      if (b < vs.length - 1) tl.append(el('span', { style: `grid-column:span ${vs.length - 1 - b}` }));
    }
    I18N.apply(tl);
  });
})();
</script>
</body>
</html>
